<!DOCTYPE html>
<html lang="en-GB" class="scroll-smooth">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>app1xy.com | Nerds of Data</title>
    <meta name="description" content="Decoding Data, Crafting Clarity. A digital hub for data-centric projects.">
    <meta name="color-scheme" content="light dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Source+Code+Pro:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Source Code Pro', 'monospace'],
                    },
                    colors: {
                        'background-light': '#F8F8F8',
                        'text-body-light': '#333333',
                        'text-heading-light': '#1A1A1A',
                        'accent-1-light': '#007BFF',
                        'accent-2-light': '#28A745',
                        'border-light': '#DDDDDD',
                        'surface-light': '#FFFFFF',

                        'background-dark': '#1A1A1A',
                        'text-body-dark': '#E0E0E0',
                        'text-heading-dark': '#F8F8F8',
                        'accent-1-dark': '#357ABD',
                        'accent-2-dark': '#5CB85C',
                        'border-dark': '#333333',
                        'surface-dark': '#2C2C2C',
                    },
                    keyframes: {
                        pulseNerd: {
                            '0%, 100%': { opacity: 1, transform: 'scale(1)' },
                            '50%': { opacity: 0.8, transform: 'scale(1.05)' },
                        },
                        fadeIn: {
                            '0%': { opacity: 0 },
                            '100%': { opacity: 1 },
                        },
                        slideInUp: {
                           '0%': { opacity: 0, transform: 'translateY(20px)' },
                           '100%': { opacity: 1, transform: 'translateY(0)' },
                        },
                        blink: {
                            'from, to': { color: 'transparent' },
                            '50%': { color: '#E0E0E0' }
                        }
                    },
                    animation: {
                        'pulse-nerd': 'pulseNerd 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'fade-in': 'fadeIn 1s ease-out forwards',
                        'slide-in-up': 'slideInUp 0.7s ease-out forwards'
                    }
                }
            }
        }
    </script>
    <style>
        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #1A1A1A;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out;
            color: #E0E0E0;
            font-family: 'Source Code Pro', monospace;
        }
        #preloader.loaded {
            opacity: 0;
            pointer-events: none;
        }
        #initial-loader {
            text-align: center;
        }
        #initial-loader .preloader-logo {
            font-size: 2rem;
            font-weight: bold;
            animation: pulseNerd 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        #initial-loader .preloader-text {
            margin-top: 1rem;
            font-size: 1rem;
        }
        #terminal-loader {
            display: none;
            flex-direction: column;
            width: 100%;
            max-width: 600px;
            height: 100%;
            padding: 2rem;
            box-sizing: border-box;
        }
        #terminal-output {
           flex-grow: 1;
           overflow-y: auto;
        }
        #terminal-output .keyword-success { color: #5CB85C; }
        #terminal-output .keyword-info { color: #357ABD; }
        .cursor { animation: blink 1s step-end infinite; }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.1.1",
    "react-dom/": "https://esm.sh/react-dom@^19.1.1/",
    "react/": "https://esm.sh/react@^19.1.1/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-background-light dark:bg-background-dark transition-colors duration-300">
    <div id="preloader">
        <div id="initial-loader" class="preloader-content">
            <div class="preloader-logo">[app1xy]</div>
            <p class="preloader-text">Initiating boot sequence...</p>
        </div>
        <div id="terminal-loader">
            <div id="terminal-output"></div>
        </div>
    </div>
    <div id="root" class="opacity-0 transition-opacity duration-1000"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const preloader = document.getElementById('preloader');
            const initialLoader = document.getElementById('initial-loader');
            const terminalLoader = document.getElementById('terminal-loader');
            const terminalOutput = document.getElementById('terminal-output');
            const rootEl = document.getElementById('root');

            const bootLines = [
                'Booting app1xy.com kernel...',
                'Checking system integrity...',
                '[<span class="keyword-success">OK</span>] System integrity check passed.',
                'Loading Nerd Collective Protocols...',
                '[<span class="keyword-info">INFO</span>] Protocol 7: Data as Creative Director... loaded.',
                '[<span class="keyword-info">INFO</span>] Protocol 13: UK Spelling Correction... enabled.',
                'Synthesising complexity...',
                '[<span class="keyword-success">SUCCESS</span>] All systems nominal.',
                '',
            ];

            let lineIndex = 0;

            function printLines() {
                if (lineIndex < bootLines.length) {
                    const newLine = document.createElement('div');
                    newLine.innerHTML = bootLines[lineIndex];
                    terminalOutput.appendChild(newLine);
                    lineIndex++;
                    setTimeout(printLines, Math.random() * 150 + 50);
                } else {
                    typePrompt();
                }
            }
            
            function typePrompt() {
                const promptContainer = document.createElement('div');
                promptContainer.innerHTML = '> <span id="prompt-text"></span><span class="cursor">_</span>';
                terminalOutput.appendChild(promptContainer);
                
                const promptText = "Press any key or click to continue...";
                const promptEl = document.getElementById('prompt-text');
                let charIndex = 0;

                function typeChar() {
                    if (charIndex < promptText.length) {
                        if(promptEl) promptEl.textContent += promptText.charAt(charIndex);
                        charIndex++;
                        setTimeout(typeChar, 50);
                    } else {
                         window.addEventListener('keydown', initApp, { once: true });
                         window.addEventListener('click', initApp, { once: true });
                    }
                }
                typeChar();
            }

            function initApp() {
                if(preloader) preloader.classList.add('loaded');
                if (rootEl) {
                    rootEl.classList.remove('opacity-0');
                }
            }

            setTimeout(() => {
                if (initialLoader) initialLoader.style.display = 'none';
                if (terminalLoader) terminalLoader.style.display = 'flex';
                printLines();
            }, 1000);
        });
    </script>
</body>
</html>
