    <style>
        body {
            /* Smooth scrolling and font rendering */
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;

        /* Custom Scrollbar for minimalist feel */

            background: transparent;
        }

        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;

            opacity: 0;

        }
        #initial-loader {
            text-align: center;
        }
        #initial-loader .preloader-logo {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: -0.1em;
        }
        #terminal-loader {
            display: none;
            flex-direction: column;
            width: 100%;
            max-width: 600px;
            height: 100%;
            padding: 2rem;
            box-sizing: border-box;
        }
        #terminal-output {
           flex-grow: 1;
           overflow-y: auto;
           font-size: 0.9rem;
           line-height: 1.6;
        }
        #terminal-output .keyword-success { color: #00FF94; }

<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.1.1",
    "react-dom/": "https://esm.sh/react-dom@^19.1.1/",
    "react/": "https://esm.sh/react@^19.1.1/",

<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-background-light dark:bg-background-dark transition-colors duration-300 selection:bg-accent-highlight selection:text-black">
    <div id="preloader">
        <div id="initial-loader" class="preloader-content">
            <div class="preloader-logo">[app1xy]</div>
            <p class="preloader-text mt-4 text-xs uppercase tracking-widest text-gray-500">System Boot</p>
        </div>
        <div id="terminal-loader">
            <div id="terminal-output"></div>
        </div>
    </div>
    <div id="root" class="opacity-0 transition-opacity duration-1000"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const preloader = document.getElementById('preloader');
            const initialLoader = document.getElementById('initial-loader');
            const terminalLoader = document.getElementById('terminal-loader');
            const terminalOutput = document.getElementById('terminal-output');
            const rootEl = document.getElementById('root');

            const bootLines = [
                'KERNEL_INIT: app1xy.com',
                'CHECKING_INTEGRITY...',
                '[<span class="keyword-success">OK</span>] CORE_SYSTEMS',
                'LOADING_MODULES:',
                '  > UI_RENDERER.........[<span class="keyword-success">OK</span>]',
                '  > DATA_PROCESSOR......[<span class="keyword-success">OK</span>]',
                '  > MINIMALISM_ENGINE...[<span class="keyword-success">OK</span>]',
                'EXECUTING STARTUP...',
                '',
            ];

            let lineIndex = 0;

            function printLines() {
                if (lineIndex < bootLines.length) {
                    const newLine = document.createElement('div');
                    newLine.innerHTML = bootLines[lineIndex];
                    terminalOutput.appendChild(newLine);
                    lineIndex++;
                    setTimeout(printLines, Math.random() * 80 + 20);
                } else {
                    typePrompt();
                }
            }
            
            function typePrompt() {
                const promptContainer = document.createElement('div');
                promptContainer.innerHTML = '> <span id="prompt-text"></span><span class="cursor"> </span>';
                terminalOutput.appendChild(promptContainer);
                
                const promptText = "CLICK_TO_ENTER_";
                const promptEl = document.getElementById('prompt-text');
                let charIndex = 0;

                function typeChar() {
                    if (charIndex < promptText.length) {
                        if(promptEl) promptEl.textContent += promptText.charAt(charIndex);
                        charIndex++;
                        setTimeout(typeChar, 50);
                    } else {
                         window.addEventListener('keydown', initApp, { once: true });
                         window.addEventListener('click', initApp, { once: true });
                    }
                }
                typeChar();
            }

            function initApp() {
                if(preloader) preloader.classList.add('loaded');
                if (rootEl) {
                    rootEl.classList.remove('opacity-0');
                }
            }

            setTimeout(() => {
                if (initialLoader) initialLoader.style.display = 'none';
                if (terminalLoader) terminalLoader.style.display = 'flex';
                printLines();
            }, 800);
        });
    </script>
</body>
